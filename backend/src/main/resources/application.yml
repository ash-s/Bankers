spring:
  application:
    name: prakash-bankers
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/prakash_bankers?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # update = keep your data between restarts (do NOT use create in daily use)
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # Required because this MySQL version fails Hibernate's metadata query
        # with "Unknown column 'RESERVED' in 'WHERE'".
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  # Override with SERVER_PORT only when necessary.
  port: ${SERVER_PORT:8082}

app:
  jwt:
    secret: PrakashBankersSecretKey2026ChangeInProductionMustBe256BitsLong!!
    expiration-ms: 86400000
  upload-dir: uploads
  cors-origins: http://localhost:8081,http://localhost:5173,http://localhost:3000
